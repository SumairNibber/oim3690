<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.5;
    }

    input,
    button {
      font-size: 1rem;
      padding: 8px;
      margin-top: 10px;
      width: 100%;
      max-width: 320px;
    }

    button {
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Grade Calculator</h1>
  <p>Type a score from 0 to 100 and click the button.</p>

  <label for="scoreInput">Score</label>
  <input id="scoreInput" type="number" min="0" max="100" placeholder="85">

  <button id="gradeButton">Get Grade</button>

  <p id="result">Your grade will appear here.</p>

  <script>
    const scoreInput = document.querySelector("#scoreInput");
    const gradeButton = document.querySelector("#gradeButton");
    const result = document.querySelector("#result");

    function getGrade(score) {
      if (score >= 90) {
        return "A";
      } else if (score >= 80) {
        return "B";
      } else if (score >= 70) {
        return "C";
      } else if (score >= 60) {
        return "D";
      } else {
        return "F";
      }
    }

    function setResultColor(grade) {
      if (grade === "A" || grade === "B") {
        result.style.color = "green";
      } else if (grade === "C") {
        result.style.color = "orange";
      } else {
        result.style.color = "red";
      }
    }

    function showGrade() {
      if (scoreInput.value === "") {
        result.textContent = "Please enter a score.";
        result.style.color = "black";
        return;
      }

      const score = Number(scoreInput.value);

      if (score < 0 || score > 100) {
        result.textContent = "Score must be 0-100.";
        result.style.color = "black";
        return;
      }

      const grade = getGrade(score);
      result.textContent = `Grade: ${grade}`;
      setResultColor(grade);
    }

    gradeButton.addEventListener("click", showGrade);
  </script>
</body>
</html>
