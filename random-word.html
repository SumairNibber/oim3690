<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Word Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.5;
    }

    button {
      font-size: 1rem;
      padding: 8px 14px;
      margin-right: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Random Word Generator</h1>
  <p>Click a button to fetch words from the class API.</p>

  <button id="oneWordButton">Get Random Word</button>
  <button id="fiveWordsButton">Get 5 Words</button>

  <p id="status"></p>
  <p id="wordOutput"></p>
  <ul id="wordList"></ul>

  <script>
    const oneWordButton = document.querySelector("#oneWordButton");
    const fiveWordsButton = document.querySelector("#fiveWordsButton");
    const status = document.querySelector("#status");
    const wordOutput = document.querySelector("#wordOutput");
    const wordList = document.querySelector("#wordList");

    async function fetchWord() {
      const response = await fetch("https://oim.108122.xyz/words/random");

      if (!response.ok) {
        throw new Error("Could not load a word.");
      }

      return response.json();
    }

    async function showOneWord() {
      status.textContent = "Loading...";
      wordOutput.textContent = "";
      wordList.innerHTML = "";

      try {
        const word = await fetchWord();
        wordOutput.textContent = `Random word: ${word}`;
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function showFiveWords() {
      status.textContent = "Loading...";
      wordOutput.textContent = "";
      wordList.innerHTML = "";

      try {
        for (let i = 0; i < 5; i++) {
          const word = await fetchWord();
          const li = document.createElement("li");
          li.textContent = word;
          wordList.appendChild(li);
        }

        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    oneWordButton.addEventListener("click", showOneWord);
    fiveWordsButton.addEventListener("click", showFiveWords);
  </script>
</body>
</html>
