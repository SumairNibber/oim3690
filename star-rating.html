<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Rating</title>
</head>
<body>
    <h1>Star Rating</h1>
    <label for="rating">Rating:</label> <input type="number" id="rating" name="rating" min="0" max="5" value="3">
    <div id="stars"></div>
    <script>
const input = document.querySelector('#rating');
const container = document.querySelector('#stars');
const drawStars = () => container.textContent = '★'.repeat(input.value) + '☆'.repeat(5 - input.value);
drawStars(); input.addEventListener('input', drawStars);
    </script>
</body>
</html>
