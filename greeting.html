<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greeting Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.5;
    }

    input,
    button {
      font-size: 1rem;
      padding: 8px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Greeting Page</h1>
  <p>Type your name and click the button to see a greeting.</p>

  <p>
    <label for="nameInput">Your name:</label><br>
    <input type="text" id="nameInput" placeholder="Type your name">
  </p>

  <p>
    <button id="greetButton">Show Greeting</button>
  </p>

  <h2 id="message">Your greeting will appear here.</h2>

  <script>
    const greetButton = document.querySelector("#greetButton");
    const nameInput = document.querySelector("#nameInput");
    const message = document.querySelector("#message");

    function showGreeting() {
      const name = nameInput.value.trim();

      if (name === "") {
        message.textContent = "Hello!";
      } else {
        message.textContent = `Hello, ${name}!`;
      }
    }

    greetButton.addEventListener("click", showGreeting);
  </script>
</body>
</html>
