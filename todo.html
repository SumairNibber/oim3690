<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f4efe7;
      --panel: #fffaf3;
      --border: #d7c9b8;
      --text: #2f241b;
      --muted: #7d6b5d;
      --accent: #c76836;
      --accent-dark: #9f4e24;
      --done: #9b8b7c;
      --danger: #a33b2f;
      --shadow: 0 18px 40px rgba(70, 43, 24, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(199, 104, 54, 0.16), transparent 28%),
        linear-gradient(180deg, #efe5d7 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 680px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero {
      padding: 32px 28px 20px;
      background: linear-gradient(135deg, rgba(199, 104, 54, 0.14), rgba(255, 250, 243, 0.4));
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .content {
      padding: 24px 28px 28px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      font: inherit;
      font-size: 1rem;
      background: #fff;
      color: var(--text);
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary-btn {
      background: var(--accent);
      color: #fff;
    }

    .primary-btn:hover {
      background: var(--accent-dark);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn,
    .secondary-btn,
    .delete-btn {
      background: #f1e5d7;
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--text);
      color: #fff;
    }

    .secondary-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .stats {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }

    .todo-item.completed .todo-text {
      color: var(--done);
      text-decoration: line-through;
    }

    .todo-text {
      word-break: break-word;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .delete-btn {
      color: var(--danger);
      padding-inline: 12px;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px 12px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 560px) {
      .app {
        border-radius: 18px;
      }

      .hero,
      .content {
        padding-inline: 18px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Todo List</h1>
      <p class="subtitle">Keep track of what matters today.</p>
    </section>

    <section class="content">
      <form class="input-row" id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a new task" autocomplete="off">
        <button class="primary-btn" type="submit">Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters" id="filters">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="active">Active</button>
          <button class="filter-btn" type="button" data-filter="completed">Completed</button>
        </div>
        <button class="secondary-btn" id="clear-completed" type="button">Clear Completed</button>
      </div>

      <p class="stats" id="stats"></p>
      <ul class="todo-list" id="todo-list"></ul>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "vanilla-todo-items";
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const stats = document.getElementById("stats");
    const clearCompletedButton = document.getElementById("clear-completed");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let todos = loadTodos();
    let currentFilter = "all";

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function addTodo(text) {
      todos.unshift({
        id: Date.now(),
        text,
        completed: false
      });
      saveTodos();
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      render();
    }

    function clearCompleted() {
      todos = todos.filter((todo) => !todo.completed);
      saveTodos();
      render();
    }

    function getFilteredTodos() {
      if (currentFilter === "active") {
        return todos.filter((todo) => !todo.completed);
      }

      if (currentFilter === "completed") {
        return todos.filter((todo) => todo.completed);
      }

      return todos;
    }

    function render() {
      const filteredTodos = getFilteredTodos();
      const remaining = todos.filter((todo) => !todo.completed).length;
      const completedCount = todos.length - remaining;

      stats.textContent = `${remaining} item${remaining === 1 ? "" : "s"} left`;
      clearCompletedButton.disabled = completedCount === 0;

      list.innerHTML = "";

      if (filteredTodos.length === 0) {
        const emptyState = document.createElement("li");
        emptyState.className = "empty-state";
        emptyState.textContent =
          todos.length === 0 ? "No tasks yet. Add one above." : "No tasks match this filter.";
        list.appendChild(emptyState);
        return;
      }

      filteredTodos.forEach((todo) => {
        const item = document.createElement("li");
        item.className = `todo-item${todo.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", `Mark ${todo.text} as complete`);
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteTodo(todo.id));

        item.append(checkbox, text, deleteButton);
        list.appendChild(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      addTodo(text);
      form.reset();
      input.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach((filterButton) => {
          filterButton.classList.toggle("active", filterButton === button);
        });
        render();
      });
    });

    clearCompletedButton.addEventListener("click", clearCompleted);

    render();
  </script>
</body>
</html>
